<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Catalogo Libri — Client API</title>
<style>
  :root{
    --ink:#2b2620;
    --paper:#f6f2ea;
    --card:#fffdf8;
    --rule:#dcd3c2;
    --accent:#5b6f4f;
    --accent-dark:#43533a;
    --danger:#a1442f;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --serif: 'Georgia', 'Iowan Old Style', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    padding:40px 20px;
    line-height:1.5;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{
    font-size:1.9rem;
    margin:0;
    letter-spacing:0.5px;
  }
  .schedario-label{
    font-family:var(--mono);
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--accent-dark);
  }
  .config{
    font-family:var(--mono);
    font-size:0.8rem;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .config input{
    font-family:var(--mono);
    font-size:0.8rem;
    padding:6px 8px;
    border:1px solid var(--rule);
    border-radius:3px;
    background:var(--card);
    width:220px;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:20px 22px;
    margin-bottom:24px;
  }
  .panel h2{
    font-size:1rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--accent-dark);
    margin:0 0 14px 0;
    font-family:var(--mono);
    font-weight:600;
  }
  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{
    font-family:var(--mono);
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#7a7264;
  }
  .field input{
    padding:9px 10px;
    border:1px solid var(--rule);
    border-radius:4px;
    font-family:var(--serif);
    font-size:0.95rem;
    background:#fffefb;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    padding:10px 18px;
    border:none;
    border-radius:4px;
    background:var(--accent);
    color:#fdfbf6;
    font-family:var(--mono);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:1px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button:hover{background:var(--accent-dark);}
  button.secondary{
    background:transparent;
    color:var(--accent-dark);
    border:1px solid var(--accent-dark);
  }
  button.secondary:hover{background:#eee7d8;}
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{
    text-align:left;
    font-family:var(--mono);
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#7a7264;
    padding:8px 6px;
    border-bottom:1px solid var(--ink);
  }
  td{
    padding:10px 6px;
    border-bottom:1px solid var(--rule);
    font-size:0.95rem;
    vertical-align:middle;
  }
  td.actions{white-space:nowrap;text-align:right;}
  td.actions button{padding:5px 10px;font-size:0.7rem;margin-left:6px;}
  .id-badge{
    font-family:var(--mono);
    font-size:0.75rem;
    color:#9a8f7a;
  }
  .empty{
    text-align:center;
    padding:30px 10px;
    color:#9a8f7a;
    font-family:var(--mono);
    font-size:0.85rem;
  }
  .status{
    font-family:var(--mono);
    font-size:0.78rem;
    padding:10px 14px;
    border-radius:4px;
    margin-bottom:16px;
    display:none;
  }
  .status.ok{background:#e8efe1;color:var(--accent-dark);display:block;}
  .status.err{background:#f4e3dd;color:var(--danger);display:block;}
  .editing-row{background:#fbf6e9;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="schedario-label">Schedario · CRUD</div>
      <h1>Catalogo Libri</h1>
    </div>
    <div class="config">
      <label for="apiBase">Base URL:</label>
      <input id="apiBase" value="http://localhost:5004/api/libri" />
      <button class="secondary" id="btnReload" type="button">Ricarica</button>
    </div>
  </header>

  <div id="status" class="status"></div>

  <div class="panel">
    <h2 id="formTitle">Nuovo libro</h2>
    <form id="libroForm">
      <input type="hidden" id="libroId" />
      <div class="field">
        <label for="titolo">Titolo</label>
        <input id="titolo" required placeholder="Es. Il Nome della Rosa" />
      </div>
      <div class="field">
        <label for="autore">Autore</label>
        <input id="autore" required placeholder="Es. Umberto Eco" />
      </div>
      <button type="submit" id="btnSubmit">Aggiungi</button>
      <button type="button" class="secondary" id="btnCancel" style="display:none;">Annulla</button>
    </form>
  </div>

  <div class="panel">
    <h2>Elenco</h2>
    <table>
      <thead>
        <tr><th style="width:60px;">ID</th><th>Titolo</th><th>Autore</th><th style="width:150px;"></th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="4" class="empty">Caricamento…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const statusBox = $('status');

function showStatus(msg, ok = true) {
  statusBox.textContent = msg;
  statusBox.className = 'status ' + (ok ? 'ok' : 'err');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { statusBox.className = 'status'; }, 3500);
}

function apiUrl(path = '') {
  const base = $('apiBase').value.replace(/\/$/, '');
  return base + path;
}

async function caricaLibri() {
  const tbody = $('tbody');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">Caricamento…</td></tr>';
  try {
      const res = await fetch(apiUrl(), {
          headers: { 'X-Api-Key': 'una-stringa-segreta-lunga-e-casuale' }
      });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const libri = await res.json();
    renderTabella(libri);
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Impossibile contattare l\'API — ' + err.message + '</td></tr>';
    showStatus('Errore nel caricamento: ' + err.message, false);
  }
}

function renderTabella(libri) {
  const tbody = $('tbody');
  if (!libri || libri.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Nessun libro presente. Aggiungine uno dal modulo qui sopra.</td></tr>';
    return;
  }
  tbody.innerHTML = libri.map(l => `
    <tr data-id="${l.id}">
      <td><span class="id-badge">#${l.id}</span></td>
      <td>${escapeHtml(l.titolo)}</td>
      <td>${escapeHtml(l.autore)}</td>
      <td class="actions">
        <button class="secondary" onclick="modificaLibro(${l.id}, '${escapeAttr(l.titolo)}', '${escapeAttr(l.autore)}')">Modifica</button>
        <button onclick="eliminaLibro(${l.id})" style="background:var(--danger);">Elimina</button>
      </td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'");
}

function modificaLibro(id, titolo, autore) {
  $('libroId').value = id;
  $('titolo').value = titolo;
  $('autore').value = autore;
  $('formTitle').textContent = 'Modifica libro #' + id;
  $('btnSubmit').textContent = 'Salva modifiche';
  $('btnCancel').style.display = 'inline-block';
  document.querySelectorAll('#tbody tr').forEach(tr => tr.classList.remove('editing-row'));
  const row = document.querySelector(`#tbody tr[data-id="${id}"]`);
  if (row) row.classList.add('editing-row');
  $('titolo').focus();
}

function annullaModifica() {
  $('libroForm').reset();
  $('libroId').value = '';
  $('formTitle').textContent = 'Nuovo libro';
  $('btnSubmit').textContent = 'Aggiungi';
  $('btnCancel').style.display = 'none';
  document.querySelectorAll('#tbody tr').forEach(tr => tr.classList.remove('editing-row'));
}

async function eliminaLibro(id) {
    if (!confirm('Eliminare il libro #' + id + '?')) return;
    try {
        const res = await fetch(apiUrl('/' + id), { method: 'DELETE' }, {
          headers: { 'X-Api-Key': 'una-stringa-segreta-lunga-e-casuala' }
      });
    if (!res.ok && res.status !== 204) throw new Error('HTTP ' + res.status);
    showStatus('Libro #' + id + ' eliminato.');
    caricaLibri();
  } catch (err) {
    showStatus('Errore nell\'eliminazione: ' + err.message, false);
  }
}

$('libroForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('libroId').value;
  const payload = { titolo: $('titolo').value.trim(), autore: $('autore').value.trim() };
  if (!payload.titolo || !payload.autore) return;

  try {
    let res;
    if (id) {
      payload.id = Number(id);
      res = await fetch(apiUrl('/' + id), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } else {
      res = await fetch(apiUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showStatus(id ? 'Libro #' + id + ' aggiornato.' : 'Libro aggiunto.');
    annullaModifica();
    caricaLibri();
  } catch (err) {
    showStatus('Errore nel salvataggio: ' + err.message, false);
  }
});

$('btnCancel').addEventListener('click', annullaModifica);
$('btnReload').addEventListener('click', caricaLibri);

caricaLibri();
</script>
</body>
</html>
